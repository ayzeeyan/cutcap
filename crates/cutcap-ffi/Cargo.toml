[package]
name = "cutcap-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "CutCap engine host and versioned C ABI consumed by the Avalonia frontend"

[lib]
# cutcap_engine.dll for the .NET frontend; rlib so Rust tests can call the session directly.
name = "cutcap_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cutcap-gpu-info"
path = "src/bin/gpu_info.rs"
required-features = ["gpu-diagnostics"]

# Phase 4B native verification: records the default output by loopback.
[[bin]]
name = "cutcap-audio-loopback"
path = "src/bin/audio_loopback.rs"
required-features = ["audio-diagnostics"]

[features]
default = []
gpu-diagnostics = ["dep:wgpu", "dep:pollster"]
audio-diagnostics = []

[dependencies]
cutcap-contracts.workspace = true
cutcap-core.workspace = true
cutcap-media.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# Phase 4B audio output: safe WASAPI bindings (MIT), exact version pinned.
wasapi = "=0.27.0"

[lints]
workspace = true
