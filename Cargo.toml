[workspace]
members = ["crates/cutcap-core", "crates/cutcap-contracts", "crates/cutcap-media", "crates/cutcap-ffi"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
cutcap-contracts = { path = "crates/cutcap-contracts" }
cutcap-core = { path = "crates/cutcap-core" }
cutcap-media = { path = "crates/cutcap-media" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
tempfile = "=3.27.0"
pollster = "1.0.1"
thiserror = "2.0.21"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "dx12"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 8
strip = "debuginfo"
